<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HLS Player</title>

<link href="https://vjs.zencdn.net/8.23.4/video-js.min.css" rel="stylesheet" />
<script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-chromecast@2.0.8/dist/videojs-chromecast.min.js"></script>
<script src="/streamer/static/player.js"></script>



  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      height: 100vh;
    }

    #channels {
      width: 260px;
      background: #1c1c1c;
      overflow-y: auto;
      border-right: 1px solid #333;
    }

    .channel {
      display: flex;
      align-items: center;
      padding: 10px;
      cursor: pointer;
    }

    .channel img {
      width: 40px;
      height: 40px;
      margin-right: 10px;
    }

    .channel.active {
      background: #333;
    }

    #player {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    video {
      width: 100%;
      height: 100%;
      background: black;
    }
  </style>
</head>
<body>

<div id="channels"></div>

<div id="player">
  <video
    id="video"
    class="video-js vjs-default-skin"
    controls
    preload="auto"
    width="100%"
    height="100%"
    data-setup='{}'
  ></video>
</div>



</body>
</html>
